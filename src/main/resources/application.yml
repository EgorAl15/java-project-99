spring:
  application:
    name: app

  profiles:
    default: development

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:development-secret-key-development-secret-key}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:development}
  traces-sample-rate: 0.0

monitoring:
  sentry-auth-token: ${SENTRY_AUTH_TOKEN:}